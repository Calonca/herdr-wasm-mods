# Every host a release ships, built and tested in CI:
# - Linux x86_64 and aarch64, static (musl), with cargo-zigbuild as RELEASING.md does it;
# - macOS Apple silicon and Intel, on a Mac with Apple's own toolchain, signed ad hoc;
# then one SHA256SUMS of them all.
#
# - Run by hand (Actions → hosts → Run workflow, on the commit to release): the builds
#   and SHA256SUMS come as the artifact wasm-mods-hosts. Put them in dist/host before
#   scripts/package.sh, so the locks pin them (RELEASING.md).
# - On a pushed tag vX.Y.Z: the same files are also added to that tag's release, if it
#   exists, each one only if the release doesn't have it yet. Those aren't the ones the
#   tag's locks pin (if any): a file the release already has is never replaced.
name: hosts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust, zig and cargo-zigbuild
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          # In a virtualenv: the runner's own Python takes no packages.
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang cargo-zigbuild
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"

      - name: Test the host
        timeout-minutes: 15
        run: cargo test --locked -p wasm-mods-host

      - name: Build both
        run: |
          mkdir -p dist
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked -p wasm-mods-host --target $arch-unknown-linux-musl
            cp target/$arch-unknown-linux-musl/release/wasm-mods-host dist/wasm-mods-host-$arch
          done

      - name: Check them
        run: |
          cd dist
          file wasm-mods-host-*
          file wasm-mods-host-x86_64 | grep -q 'x86-64.*statically linked'
          file wasm-mods-host-aarch64 | grep -q 'ARM aarch64.*statically linked'
          ./wasm-mods-host-x86_64 --version --json

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-mods-host-linux
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test the host
        timeout-minutes: 15
        run: cargo test --locked -p wasm-mods-host

      - name: Build both
        run: |
          mkdir -p dist
          for arch in aarch64 x86_64; do
            cargo build --release --locked -p wasm-mods-host --target $arch-apple-darwin
            cp target/$arch-apple-darwin/release/wasm-mods-host dist/wasm-mods-host-macos-$arch
          done

      - name: Check them
        run: |
          cd dist
          for f in wasm-mods-host-macos-*; do
            # Apple's linker signs (ad hoc) only the build for the runner's own
            # architecture; the x86_64 one comes out unsigned, and macOS won't run that.
            codesign --sign - --force "$f"
            codesign --verify --verbose "$f"
            lipo -info "$f"
          done
          ./wasm-mods-host-macos-aarch64 --version --json

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-mods-host-macos
          path: dist/*
          if-no-files-found: error

  sums:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-mods-host-*
          path: dist
          merge-multiple: true

      - name: One SHA256SUMS
        run: |
          cd dist
          chmod 755 wasm-mods-host-*
          ls -l
          test "$(ls wasm-mods-host-* | wc -l)" -eq 4
          sha256sum wasm-mods-host-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-mods-hosts
          path: dist/*
          if-no-files-found: error

      - name: Add them to the tag's release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release $TAG yet: the builds are in the artifact"; exit 0
          fi
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in dist/*; do
            if printf '%s\n' "$have" | grep -qx "$(basename "$f")"; then
              echo "$(basename "$f") is there already: kept"
            else
              gh release upload "$TAG" "$f"
            fi
          done
