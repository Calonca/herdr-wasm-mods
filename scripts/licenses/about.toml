# cargo-about: the licences of the crates built into what a release ships, the host and
# the modules (scripts/licenses/generate.sh writes THIRD-PARTY-LICENSES with it).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
ignore-dev-dependencies = true
# Our own crates (MIT OR Apache-2.0, not published) aren't third-party.
private = { ignore = true }
