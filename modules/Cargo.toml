# WASM mods: small apps the wasm-mods host runs as sandboxed WebAssembly. Build them all with
#   cargo build --release --target wasm32-unknown-unknown   (from this directory)
# and install with ../scripts/install.sh (copies target/wasm32-unknown-unknown/release/*.wasm
# to ~/.local/share/wasm-mods/modules/, where the host reloads them live). Unit tests run
# natively: `cargo test`.
[workspace]
resolver = "3"
members = ["hello", "todo", "git-graph"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
wasm-mods-sdk = { path = "../crates/wasm-mods-sdk" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
